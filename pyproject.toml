[build-system]
requires = ["setuptools>=68", "wheel", "torch>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "minipu-backend"
version = "0.1.0"
description = "Minimal PyTorch PrivateUse1 backend with CPU fallback."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.1"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
