[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "torch",
]
build-backend = "setuptools.build_meta"

[project]
name = "minipu-backend"
version = "0.1.0"
description = "Minimal PyTorch PrivateUse1 CUDA backend"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["minipu_backend*"]